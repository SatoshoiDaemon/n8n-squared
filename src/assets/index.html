<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f6fa" />
		<title>Squared</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="shell">
			<header class="topbar">
				<a class="brand" href="/" aria-label="Squared início"><span class="brand-mark">S</span><span>Squared</span></a>
				<div class="topbar-right"><span class="status-dot"></span><span>Workspace</span><button class="quiet-button" id="change-token">Sair</button></div>
			</header>
			<div class="layout">
				<aside class="sidebar">
					<div class="sidebar-heading"><span>WORKSPACE</span><button class="icon-button" id="new-workflow" title="Novo workflow">＋</button></div>
					<nav id="workflow-list" aria-label="Workflows"></nav>
					<div class="sidebar-footer"><span class="mini-mark">S</span><div><strong>Squared 0.1.0</strong><small>Automação para Square Cloud</small></div></div>
				</aside>
				<main id="main-content" class="main-content">
					<div class="empty-state"><div class="empty-icon">◇</div><h1>Crie seu primeiro workflow</h1><p>Combine gatilhos, dados e integrações em uma sequência de automação.</p><button class="primary-button" id="empty-new">Novo workflow</button></div>
				</main>
			</div>
		</div>
		<div class="login-backdrop" id="login-backdrop" hidden>
			<form class="login-card" id="login-form">
				<div class="brand-mark large">S</div><p class="eyebrow">SQUARED WORKSPACE</p><h1>Acesse seu workspace</h1>
				<p class="muted">Use o token de acesso configurado nas variáveis da aplicação.</p>
				<label for="access-token">Token de acesso</label><input id="access-token" type="password" autocomplete="current-password" required minlength="24" />
				<button class="primary-button full-width" type="submit">Continuar</button><p class="form-error" id="login-error"></p>
			</form>
		</div>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>
		<script type="module" src="/app.js"></script>
	</body>
</html>
